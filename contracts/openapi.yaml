                  "type": "string",
                  "format": "binary"
                }
              }
            }
          },
          "206": {
            "description": "Single byte range"
          },
          "400": {
            "description": "Malformed Range"
          },
          "403": {
            "description": "Invalid/expired signature"
          },
          "416": {
            "description": "Unsatisfiable range; Content-Range: bytes */size"
          },
          "503": {
            "description": "Media temporarily unavailable"
          }
        }
      },
      "head": {
        "summary": "Private MP3; signature verified on every request, HEAD ignores Range",
        "security": [],
        "parameters": [
          {
            "name": "audioId",
            "in": "path",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "exp",
            "in": "query",
            "required": true,
            "schema": {
              "type": "integer",
              "minimum": 0
            }
          },
          {
            "name": "sig",
            "in": "query",
            "required": true,
            "schema": {
              "type": "string"
            }
          },
          {
            "name": "Range",
            "in": "header",
            "schema": {
              "type": "string"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Full MP3 / HEAD metadata",
            "content": {
              "audio/mpeg": {
                "schema": {
                  "type": "string",
                  "format": "binary"
                }
              }
            }
          },
          "206": {
            "description": "Single byte range"
          },
          "400": {
            "description": "Malformed Range"
          },
          "403": {
            "description": "Invalid/expired signature"
          },
          "416": {
            "description": "Unsatisfiable range; Content-Range: bytes */size"
          },
          "503": {
            "description": "Media temporarily unavailable"
          }
        }
      }
    }
