log_format quill_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 80;
    server_name codingluke.site;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/quill/acme; }
    location / { return 301 https://codingluke.site$request_uri; }
    access_log /var/log/nginx/quill.access.log quill_safe;
}
server {
    listen 443 ssl;
    server_name codingluke.site;
    ssl_certificate /etc/letsencrypt/live/codingluke.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codingluke.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    access_log /var/log/nginx/quill.access.log quill_safe;
    # Nginx error logs can include request query strings; app logs supply safe diagnostics.
    error_log /var/log/nginx/quill.error.log crit;
    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache off;
        proxy_read_timeout 60s;
    }
}
